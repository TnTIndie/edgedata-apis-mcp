startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - rapidApiKey
    properties:
      rapidApiKey:
        type: string
        description: Your RapidAPI API key (subscribe free on https://rapidapi.com/user/tamnt).
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'edgedata-apis-mcp'],
      env: { RAPIDAPI_KEY: config.rapidApiKey }
    })
